[package]
name = "Hobbes"
version = "0.9.59"
authors = ["Dustin Moore <dustin@clearmirror.ai>", "Gemini 2.5/3 Pro and Flash (and a touch of Claude 3.7/4.5 Sonnet)"]
edition = "2024"
license-file = "LICENSE"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
members = [
    "apps/macos_app",
    "apps/windows_app",
    "packages/feature_clipboard",
    "packages/hobbes_core",
]

[workspace.dependencies]
dioxus = { version = "0.6.3", features = ["router", "desktop"] }
dioxus-desktop = "0.6.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tray-icon = "0.19.3"
image = { version = "0.25.1", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
dioxus-signals = "0.6.3"
global-hotkey = "0.5.0"
dioxus-logger = "0.5.0"
futures-util = "0.3.31"
serde_json = "1.0.141"
tracing = "0.1.40"
macos-accessibility-client = "0.0.1"
hobbes_core = { path = "packages/hobbes_core" }
feature_clipboard = { path = "packages/feature_clipboard" }
dioxus-free-icons = { version = "0.9.0", features = ["feather", "font-awesome-brands"] }
pulldown-cmark = "0.11.0"
syntect = "5.2.0"
lazy_static = "1.4.0"
rmcp = { version = "0.10.0", features = ["client", "transport-child-process", "transport-io", "transport-async-rw", "transport-sse-client", "transport-sse-client-reqwest"] }
[dependencies]
dioxus = { version = "0.6.3", features = ["router", "desktop"] }
dioxus-desktop = "0.6.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tray-icon = "0.19.3"
image = { version = "0.25.1", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
dioxus-signals = "0.6.3"
global-hotkey = "0.5.0"
dioxus-logger = "0.5.0"
futures-util = "0.3.31"
serde_json = "1.0.141"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tracing-appender = "0.2"
serde = { version = "1.0", features = ["derive"] }
# macos-accessibility-client is now only in target-specific dependencies
dirs = "5.0"
dioxus-free-icons = { version = "0.9.0", features = ["feather", "font-awesome-brands"] }
uuid = { version = "1.8.0", features = ["v4", "serde"] }
reqwest = { version = "0.12.5", features = ["json"] }
dotenvy = "0.15.7"
pulldown-cmark = { workspace = true }
syntect = { workspace = true }
lazy_static = { workspace = true }
feature_clipboard = { workspace = true }
hobbes_core = { workspace = true }
thiserror = "1.0"
futures = "0.3.31"
chrono = { version = "0.4.41", features = ["serde"] }
rmcp = { workspace = true }
http = "1.1.0"
cfg-if = "1.0.3"
rfd = "0.15.4"
ammonia = "4.1.2"
base64 = "0.22.1"
async-trait = "0.1.80"
arboard = "3.6.1"
dioxus-sdk = { version = "0.6.0", features = ["clipboard"] }
zip = "0.6.6"
urlencoding = "2.1.3"
sse-stream = "0.2"
url = "2.5"
sha2 = "0.10.9"
rand = "0.9.2"
open = "5.3.3"
tempfile = "3.14"
regex = "1.10"
serde_norway = "0.9.42"
sublime_fuzzy = "0.7.0"
json2markdown = "0.2.1"
[target.'cfg(target_os = "macos")'.dependencies]
macos-accessibility-client = { workspace = true }
security-framework = "2.11.0"
# Biometric authentication (Touch ID) support via LAContext
objc2 = "0.6"
objc2-local-authentication = "0.3"
objc2-foundation = "0.3"
block2 = "0.6"
# Low-level FFI for keychain operations with auth context
core-foundation = "0.10"
security-framework-sys = "2.11.0"
# Official Apple Security.framework bindings for SecAccessControl
objc2-security = { version = "0.3", features = ["SecAccessControl", "SecItem"] }
[package.metadata.bundle]
name = "Hobbes"
identifier = "ai.clearmirror.cai-hobbes"
icon = ["assets/icon.icns"]
[package.metadata.bundle.plist]
NSAppleEventsUsageDescription = "The application needs to listen for global hotkeys to show and hide the main window."

[features]
default = ["desktop"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"

[dev-dependencies]
wiremock = "0.6.5"




[target.'cfg(not(target_os = "macos"))'.dependencies]
keyring = "2"
