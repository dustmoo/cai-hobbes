name: CI

on:
  push:
    branches: [ "main", "feat/**" ]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'

env:
  CARGO_TERM_COLOR: always
  CI: true

jobs:
  # Security audit (runs in parallel, platform-independent via Cargo.lock)
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable

    - name: Security Audit
      run: |
        cargo install cargo-audit
        cargo audit --ignore RUSTSEC-2024-0413 --ignore RUSTSEC-2024-0416 --ignore RUSTSEC-2024-0370 --ignore RUSTSEC-2024-0320 --ignore RUSTSEC-2024-0429 --ignore RUSTSEC-2025-0067 --ignore RUSTSEC-2025-0068

  # Cross-platform build check (fast, no tests or full build)
  build-check:
    name: Build Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Install System Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libglib2.0-dev libsecret-1-dev pkg-config libwebkit2gtk-4.1-dev

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install NPM dependencies
      # Required for tailwindcss used in build.rs
      run: npm ci

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2

    - name: Cargo Check
      run: cargo check --release

  # Full build and test (macOS only)
  build-macos:
    name: Build & Test (macOS)
    runs-on: macos-latest
    needs: build-check  # Only run after build-check passes

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2

    - name: Install Dioxus CLI
      run: cargo install dioxus-cli


    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install NPM dependencies
      run: npm ci

    - name: Run Tests
      run: cargo test --release

    - name: Build Release (CI Mode)
      run: ./scripts/build_release.sh

