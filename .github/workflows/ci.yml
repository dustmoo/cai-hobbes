name: CI

on:
  push:
    branches: [ "main", "feat/**" ]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'

env:
  CARGO_TERM_COLOR: always
  CI: true
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Security audit (runs in parallel, platform-independent via Cargo.lock)
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable

    - name: Security Audit
      run: |
        # --locked: build cargo-audit from its own lockfile — a fresh
        # resolution has broken the install before (tinyvec, 2026-09).
        cargo install cargo-audit --locked
        # Ignore policy: an ignore is allowed ONLY when no upstream fix exists
        # (or the vulnerable code is provably not compiled), with the reason
        # recorded here. Audited 2026-07-13 — all previously stale ignores removed.
        #
        # RUSTSEC-2026-0189: rmcp Streamable HTTP *server* transport (DNS
        #   rebinding). Hobbes builds rmcp with client-only features, so the
        #   vulnerable server module is not compiled. Proper fix is the
        #   rmcp 1.x migration — re-evaluate then.
        # RUSTSEC-2026-0194 / 0195: quick-xml 0.39 pulled ONLY by
        #   wayland-scanner (Linux build-time codegen of trusted wayland
        #   protocol XML; not attacker-reachable). Its latest release still
        #   pins ^0.39 — drop these when wayland-scanner moves to >=0.41.
        # RUSTSEC-2026-0257: webbrowser BROWSER-env argument injection. Fix
        #   is webbrowser >=1.2.2 but dioxus-desktop 0.6 pins ^0.8; exploit
        #   requires an attacker-controlled BROWSER env var on the user's
        #   own machine (local desktop app). Drop on the Dioxus 0.7 upgrade.
        cargo audit --ignore RUSTSEC-2026-0189 --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195 --ignore RUSTSEC-2026-0257

  # Cross-platform build check (fast, no tests or full build)
  build-check:
    name: Build Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Install System Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libglib2.0-dev libsecret-1-dev pkg-config libwebkit2gtk-4.1-dev

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Install NPM dependencies
      # Required for tailwindcss used in build.rs
      run: npm ci

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2

    - name: Cargo Check
      run: cargo check --release

  # Full build and test (macOS only)
  build-macos:
    name: Build & Test (macOS)
    runs-on: macos-latest
    needs: build-check  # Only run after build-check passes

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2

    - name: Install Dioxus CLI
      run: |
        ARCH=$(uname -m)
        if [ "$ARCH" = "arm64" ]; then TARGET="aarch64-apple-darwin"; else TARGET="x86_64-apple-darwin"; fi
        curl -fsSL "https://github.com/DioxusLabs/dioxus/releases/download/v0.6.3/dx-${TARGET}-v0.6.3.tar.gz" | tar -xz -C /usr/local/bin
        dx --version

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Install NPM dependencies
      run: npm ci

    - name: Run Tests
      run: cargo test --release

    - name: Build Release (CI Mode)
      run: ./scripts/build_release.sh

  # ── ENABLED: Azure certificate validation completed ──
  build-windows-release:
    name: Build Release (Windows)
    runs-on: windows-latest
    needs: build-check
    permissions:
      contents: write
      id-token: write # Required for Azure OIDC authentication (main only)
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/feat/')

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Install NPM dependencies
      run: npm ci

    - name: Build Release Binary
      shell: pwsh
      run: |
        & .\scripts\build_windows.ps1 -Release

    - name: Extract Version
      id: version
      shell: pwsh
      run: |
        $content = Get-Content Cargo.toml -Raw
        if ($content -match 'version\s*=\s*"([^"]+)"') {
          echo "VERSION=$($matches[1])" >> $env:GITHUB_OUTPUT
          Rename-Item -Path "target\release\hobbes_$($matches[1]).exe" -NewName "Hobbes-Windows-v$($matches[1]).exe"
        }

    - name: Azure OIDC Login
      if: github.ref == 'refs/heads/main'
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Sign Main Binary
      if: github.ref == 'refs/heads/main'
      uses: azure/artifact-signing-action@v1.2.0
      with:
        endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
        signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}
        certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE_NAME }}
        files-folder: target\release
        files-folder-filter: exe
        timestamp-rfc3161: http://timestamp.acs.microsoft.com

    - name: Upload Binary Artifact
      uses: actions/upload-artifact@v4
      with:
        name: hobbes-windows-${{ steps.version.outputs.VERSION }}
        path: target/release/Hobbes-Windows-v${{ steps.version.outputs.VERSION }}.exe
        retention-days: 30
