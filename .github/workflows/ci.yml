name: CI

on:
  push:
    branches: [ "main", "feat/**" ]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'

env:
  CARGO_TERM_COLOR: always
  CI: true

jobs:
  # Security audit (runs in parallel, platform-independent via Cargo.lock)
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable

    - name: Security Audit
      run: |
        cargo install cargo-audit
        cargo audit --ignore RUSTSEC-2024-0413 --ignore RUSTSEC-2024-0416 --ignore RUSTSEC-2024-0370 --ignore RUSTSEC-2024-0320 --ignore RUSTSEC-2024-0429 --ignore RUSTSEC-2025-0067 --ignore RUSTSEC-2025-0068 --ignore RUSTSEC-2026-0104 --ignore RUSTSEC-2026-0099 --ignore RUSTSEC-2026-0098

  # Cross-platform build check (fast, no tests or full build)
  build-check:
    name: Build Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Install System Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libglib2.0-dev libsecret-1-dev pkg-config libwebkit2gtk-4.1-dev

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install NPM dependencies
      # Required for tailwindcss used in build.rs
      run: npm ci

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2

    - name: Cargo Check
      run: cargo check --release

  # Full build and test (macOS only)
  build-macos:
    name: Build & Test (macOS)
    runs-on: macos-latest
    needs: build-check  # Only run after build-check passes

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2

    - name: Install cargo-binstall
      uses: cargo-bins/cargo-binstall@main

    - name: Install Dioxus CLI
      run: cargo binstall dioxus-cli --version 0.6.3 --no-confirm


    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install NPM dependencies
      run: npm ci

    - name: Run Tests
      run: cargo test --release

    - name: Build Release (CI Mode)
      run: ./scripts/build_release.sh

  # ── ENABLED: Azure certificate validation completed ──
  build-windows-release:
    name: Build Release (Windows)
    runs-on: windows-latest
    needs: build-check
    permissions:
      contents: write
      id-token: write # Required for Azure OIDC authentication
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/feat/')

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install NPM dependencies
      run: npm ci

    - name: Build Release Binary
      shell: pwsh
      run: |
        & .\scripts\build_windows.ps1 -Release

    - name: Extract Version
      id: version
      shell: pwsh
      run: |
        $content = Get-Content Cargo.toml -Raw
        if ($content -match 'version\s*=\s*"([^"]+)"') {
          echo "VERSION=$($matches[1])" >> $env:GITHUB_OUTPUT
          Rename-Item -Path "target\release\hobbes_$($matches[1]).exe" -NewName "Hobbes-Windows-v$($matches[1]).exe"
        }

    - name: Azure OIDC Login
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Sign Main Binary
      uses: azure/trusted-sign-action@v0.5.0
      with:
        endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
        signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}
        certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE_NAME }}
        files-folder: target\release
        files-folder-filter: exe
        timestamp-rfc3161: http://timestamp.acs.microsoft.com

    - name: Upload Binary Artifact
      uses: actions/upload-artifact@v4
      with:
        name: hobbes-windows-${{ steps.version.outputs.VERSION }}
        path: target/release/Hobbes-Windows-v${{ steps.version.outputs.VERSION }}.exe
        retention-days: 30
