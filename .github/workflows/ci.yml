name: CI

on:
  push:
    branches: [ "main", "feat/**" ]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'

env:
  CARGO_TERM_COLOR: always
  CI: true

jobs:
  # Cross-platform build check (fast, no tests or full build)
  build-check:
    name: Build Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2

    - name: Cargo Check
      run: cargo check --release

  # Full build and test (macOS only)
  build-macos:
    name: Build & Test (macOS)
    runs-on: macos-latest
    needs: build-check  # Only run after build-check passes

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2

    - name: Install Dioxus CLI
      run: cargo install dioxus-cli

    - name: Security Audit
      run: |
        cargo install cargo-audit
        cargo audit

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install NPM dependencies
      run: npm ci

    - name: Run Tests
      run: cargo test --release

    - name: Build Release (CI Mode)
      run: ./scripts/build_release.sh
