name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  CI: true

jobs:
  build:
    name: Build & Test (macOS)
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2

    - name: Install Dioxus CLI
      run: |
        curl -L --proto '=https' --tlsv1.2 -s https://raw.githubusercontent.com/DioxusLabs/dioxus/master/install.sh | bash
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Run Tests
      # Run tests in release mode to match production
      run: cargo test --release

    - name: Build Release (CI Mode)
      # This runs our build script which now checks for $CI to skip signing
      run: ./scripts/build_release.sh
