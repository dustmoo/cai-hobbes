[package]
name = "windows_app"
version = "0.1.1"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

description = "Coming Soon: Windows support for Hobbes"
publish = false

[[bin]]
name = "windows_app"
path = "../../src/main.rs"

[dependencies]
# Workspace dependencies
dioxus = { workspace = true, features = ["desktop"] }
dioxus-desktop = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
tray-icon = { workspace = true }
image = { workspace = true, features = ["png"] }
dioxus-signals = { workspace = true }
global-hotkey = { workspace = true }
dioxus-logger = { workspace = true }
futures-util = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

# Internal packages
serde = { version = "1.0", features = ["derive"] }
dioxus-free-icons = { workspace = true, features = ["feather", "font-awesome-brands"] }
uuid = { version = "1.8.0", features = ["v4", "serde"] }
reqwest = { version = "0.12.5", features = ["json"] }
dotenvy = "0.15.7"
pulldown-cmark = { workspace = true }
syntect = "5.2"
lazy_static = "1.4"
feature_clipboard = { path = "../../packages/feature_clipboard" }
hobbes_core = { path = "../../packages/hobbes_core" }
thiserror = "1.0"
futures = "0.3.31"
chrono = { version = "0.4.41", features = ["serde"] }
rmcp = { workspace = true }
http = "1.1.0"
cfg-if = "1.0.3"
rfd = "0.15.4"
ammonia = "4.1.2"
base64 = "0.22.1"
async-trait = "0.1.80"
arboard = "3.6.1"
dioxus-sdk = { version = "0.6.0", features = ["clipboard"] }
zip = "0.6.6"
urlencoding = "2.1.3"
sse-stream = "0.2"
url = "2.5"
sha2 = "0.10.9"
rand = "0.9.2"
open = "5.3.3"
tempfile = "3.14"
dirs = "5.0"

[dev-dependencies]
wiremock = "0.6.5"